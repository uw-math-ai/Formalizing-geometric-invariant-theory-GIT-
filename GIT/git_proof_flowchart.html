<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GIT Lean Proof Structure</title>

<style>
body {
  font-family: "Palatino Linotype", "Book Antiqua",
               Palatino, Georgia, serif;
  background: #fff;
  margin: 40px;
  color: #1a1a1a;
}

h1 {
  font-size: 20px;
  font-weight: normal;
  margin-bottom: 4px;
  color: #4b2e83;
}

p.subtitle {
  font-size: 13px;
  color: #666;
  margin: 0 0 24px;
}

.label,
.sub,
.note {
  font-family: inherit;
}

/* ── Node styles ── */

.node-purple rect {
  fill: #EEEDFE;
  stroke: #534AB7;
}

.node-teal rect {
  fill: #E1F5EE;
  stroke: #0F6E56;
}

.node-coral rect {
  fill: #FAECE7;
  stroke: #993C1D;
}

.node-gray rect {
  fill: #F1EFE8;
  stroke: #5F5E5A;
}

.node-purple .label {
  fill: #3C3489;
  font-weight: 600;
  font-size: 13px;
}

.node-teal .label {
  fill: #085041;
  font-weight: 600;
  font-size: 13px;
}

.node-coral .label {
  fill: #712B13;
  font-weight: 600;
  font-size: 13px;
}

.node-gray .label {
  fill: #444441;
  font-weight: 600;
  font-size: 13px;
}

.node-purple .sub {
  fill: #534AB7;
  font-size: 11px;
}

.node-teal .sub {
  fill: #0F6E56;
  font-size: 11px;
}

.node-coral .sub {
  fill: #993C1D;
  font-size: 11px;
}

.node-gray .sub {
  fill: #5F5E5A;
  font-size: 11px;
}

.arrow {
  stroke: #888;
  stroke-width: 1.2;
  fill: none;
  marker-end: url(#arr);
}

.note {
  font-size: 11px;
  fill: #534AB7;
  font-style: italic;
}
</style>
</head>

<body>

<h1>GIT in Lean — Proof Structure</h1>
<p class="subtitle">
GIT Main lean proof flowchart · University of Washington Math AI Lab
</p>

<svg width="760" height="940" viewBox="0 0 760 940"
     xmlns="http://www.w3.org/2000/svg">

<defs>
  <marker id="arr"
          viewBox="0 0 10 10"
          refX="8"
          refY="5"
          markerWidth="6"
          markerHeight="6"
          orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9"
          fill="none"
          stroke="#888"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ───────────────────────────── -->
<!-- Part 1 -->
<!-- ───────────────────────────── -->

<g class="node-purple">
  <rect x="80" y="20" width="600" height="58"
        rx="8" stroke-width="0.8"/>

  <text class="label"
        x="380" y="44"
        text-anchor="middle"
        dominant-baseline="central">
    Part 1 — R^G is internally graded
  </text>

  <text class="sub"
        x="380" y="64"
        text-anchor="middle"
        dominant-baseline="central">
    Each invariant decomposes uniquely into invariant homogeneous parts
  </text>
</g>

<line x1="380" y1="78"
      x2="380" y2="108"
      class="arrow"/>

<!-- ───────────────────────────── -->
<!-- Part 2 -->
<!-- ───────────────────────────── -->

<g class="node-purple">
  <rect x="80" y="108" width="600" height="58"
        rx="8" stroke-width="0.8"/>

  <text class="label"
        x="380" y="132"
        text-anchor="middle"
        dominant-baseline="central">
    Part 2 — Irrelevant ideal and finite type
  </text>

  <text class="sub"
        x="380" y="152"
        text-anchor="middle"
        dominant-baseline="central">
    Finitely generated irrelevant ideal ⇒ R is finitely generated over k
  </text>
</g>

<line x1="380" y1="166"
      x2="380" y2="196"
      class="arrow"/>

<!-- ───────────────────────────── -->
<!-- Part 3 -->
<!-- ───────────────────────────── -->

<g class="node-teal">
  <rect x="80" y="196" width="600" height="58"
        rx="8" stroke-width="0.8"/>

  <text class="label"
        x="380" y="220"
        text-anchor="middle"
        dominant-baseline="central">
    Part 3 — Noetherian rings have finitely generated ideals
  </text>

  <text class="sub"
        x="380" y="240"
        text-anchor="middle"
        dominant-baseline="central">
    Every ideal admits a finite generating set
  </text>
</g>

<line x1="380" y1="254"
      x2="380" y2="284"
      class="arrow"/>

<!-- ───────────────────────────── -->
<!-- Part 4 -->
<!-- ───────────────────────────── -->

<g class="node-teal">
  <rect x="80" y="284" width="600" height="58"
        rx="8" stroke-width="0.8"/>

  <text class="label"
        x="380" y="308"
        text-anchor="middle"
        dominant-baseline="central">
    Part 4 — Finite generation of the invariant ideal
  </text>

  <text class="sub"
        x="380" y="328"
        text-anchor="middle"
        dominant-baseline="central">
    A finite collection of positive-degree invariants generates the same ideal
  </text>
</g>

<!-- fork -->

<line x1="380" y1="342"
      x2="215" y2="386"
      class="arrow"/>

<line x1="380" y1="342"
      x2="545" y2="386"
      class="arrow"/>

<!-- ───────────────────────────── -->
<!-- Part 5 -->
<!-- ───────────────────────────── -->

<g class="node-coral">
  <rect x="80" y="386" width="270" height="88"
        rx="8" stroke-width="0.8"/>

  <text class="label"
        x="215" y="410"
        text-anchor="middle">
    Part 5 — Construction of finitely many
  </text>

  <text class="label"
        x="215" y="428"
        text-anchor="middle">
    positive-degree invariant generators
  </text>

  <text class="sub"
        x="215" y="450"
        text-anchor="middle">
    Positive-degree invariants are controlled
  </text>

  <text class="sub"
        x="215" y="466"
        text-anchor="middle">
    by finitely many generators
  </text>
</g>

<!-- ───────────────────────────── -->
<!-- Part 5.5 -->
<!-- ───────────────────────────── -->

<g class="node-coral">
  <rect x="410" y="386" width="270" height="72"
        rx="8" stroke-width="0.8"/>

  <text class="label"
        x="545" y="412"
        text-anchor="middle">
    Part 5.5 — Existence of the Reynolds operator
  </text>

  <text class="sub"
        x="545" y="434"
        text-anchor="middle">
    Linear reductivity provides
  </text>

  <text class="sub"
        x="545" y="450"
        text-anchor="middle">
    a projection onto invariants
  </text>
</g>

<line x1="215" y1="474"
      x2="215" y2="516"
      class="arrow"/>

<line x1="545" y1="458"
      x2="545" y2="516"
      class="arrow"/>

<line x1="215" y1="516"
      x2="380" y2="516"
      stroke="#888"
      stroke-width="1.2"/>

<line x1="545" y1="516"
      x2="380" y2="516"
      stroke="#888"
      stroke-width="1.2"/>

<line x1="380" y1="516"
      x2="380" y2="540"
      class="arrow"/>

<!-- ───────────────────────────── -->
<!-- Part 6 -->
<!-- ───────────────────────────── -->

<g class="node-coral">
  <rect x="80" y="540" width="600" height="72"
        rx="8" stroke-width="0.8"/>

  <text class="label"
        x="380" y="566"
        text-anchor="middle">
    Part 6 — Expressing invariants via Reynolds projections
  </text>

  <text class="sub"
        x="380" y="588"
        text-anchor="middle">
    Every invariant can be rewritten using
  </text>

  <text class="sub"
        x="380" y="604"
        text-anchor="middle">
    the chosen finite invariant generating set
  </text>
</g>

<!-- arrow -->

<line x1="380" y1="612"
      x2="380" y2="650"
      class="arrow"/>

<!-- ───────────────────────────── -->
<!-- Part 7 -->
<!-- ───────────────────────────── -->

<g class="node-purple">
  <rect x="80" y="650" width="600" height="72"
        rx="8" stroke-width="1.2"/>

  <text class="label"
        x="380" y="676"
        text-anchor="middle">
    Part 7 — Finite generation of the invariant algebra
  </text>

  <text class="sub"
        x="380" y="698"
        text-anchor="middle">
    Degree-zero invariants and the invariant ideal
  </text>

  <text class="sub"
        x="380" y="714"
        text-anchor="middle">
    generate the full invariant algebra
  </text>
</g>

<!-- ───────────────────────────── -->
<!-- Notes -->
<!-- ───────────────────────────── -->

<text class="note"
      x="380" y="770"
      text-anchor="middle">
  Parts 1–2 establish the graded structure of the invariant algebra
</text>

<text class="note"
      x="380" y="790"
      text-anchor="middle">
  Parts 3–6 construct finite invariant generators using Reynolds operators
</text>

<text class="note"
      x="380" y="810"
      text-anchor="middle">
  Part 7 combines these ingredients to prove finite generation
</text>

<!-- ───────────────────────────── -->
<!-- Legend -->
<!-- ───────────────────────────── -->

<rect x="80" y="850"
      width="18" height="18"
      rx="3"
      fill="#EEEDFE"
      stroke="#534AB7"
      stroke-width="0.8"/>

<text x="105" y="864"
      font-size="11"
      fill="#444">
  Graded algebra results
</text>

<rect x="260" y="850"
      width="18" height="18"
      rx="3"
      fill="#E1F5EE"
      stroke="#0F6E56"
      stroke-width="0.8"/>

<text x="285" y="864"
      font-size="11"
      fill="#444">
  Ideal / finite generation results
</text>

<rect x="490" y="850"
      width="18" height="18"
      rx="3"
      fill="#FAECE7"
      stroke="#993C1D"
      stroke-width="0.8"/>

<text x="515" y="864"
      font-size="11"
      fill="#444">
  Reynolds / invariant-theoretic arguments
</text>

</svg>
</body>
</html>
