<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GIT Lean Proof Structure</title>
<style>
  body {
    font-family: Georgia, serif;
    background: #fff;
    margin: 40px;
    color: #1a1a1a;
  }
  h1 {
    font-size: 18px;
    font-weight: normal;
    margin-bottom: 4px;
    color: #4b2e83;
  }
  p.subtitle {
    font-size: 13px;
    color: #666;
    margin: 0 0 24px;
  }

  /* ── Node styles ── */
  .node-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .node-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
  .node-coral  rect { fill: #FAECE7; stroke: #993C1D; }
  .node-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }

  .node-purple .label { fill: #3C3489; font-weight: 600; font-size: 13px; }
  .node-teal   .label { fill: #085041; font-weight: 600; font-size: 13px; }
  .node-coral  .label { fill: #712B13; font-weight: 600; font-size: 13px; }
  .node-gray   .label { fill: #444441; font-weight: 600; font-size: 13px; }

  .node-purple .sub { fill: #534AB7; font-size: 11px; }
  .node-teal   .sub { fill: #0F6E56; font-size: 11px; }
  .node-coral  .sub { fill: #993C1D; font-size: 11px; }
  .node-gray   .sub { fill: #5F5E5A; font-size: 11px; }

  .arrow { stroke: #888; stroke-width: 1.2; fill: none; marker-end: url(#arr); }
  .note  { font-size: 11px; fill: #534AB7; font-style: italic; }
</style>
</head>
<body>

<h1>GIT in Lean — proof structure</h1>
<p class="subtitle">Parts 1–7 of part1-7.lean · University of Washington Math AI Lab</p>

<svg width="760" height="860" viewBox="0 0 760 860" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ── Part 1 ── -->
<g class="node-purple">
  <rect x="80" y="20" width="600" height="58" rx="8" stroke-width="0.8"/>
  <text class="label" x="380" y="44" text-anchor="middle" dominant-baseline="central">Part 1 — graded invariants</text>
  <text class="sub"   x="380" y="64" text-anchor="middle" dominant-baseline="central">R^G is internally graded; invariant homogeneous decomposition</text>
</g>

<line x1="380" y1="78"  x2="380" y2="108" class="arrow"/>

<!-- ── Part 2 ── -->
<g class="node-purple">
  <rect x="80" y="108" width="600" height="58" rx="8" stroke-width="0.8"/>
  <text class="label" x="380" y="132" text-anchor="middle" dominant-baseline="central">Part 2 — irrelevant ideal and finite type</text>
  <text class="sub"   x="380" y="152" text-anchor="middle" dominant-baseline="central">Finitely generated irrelevant ideal → R is finitely generated over k</text>
</g>

<line x1="380" y1="166" x2="380" y2="196" class="arrow"/>

<!-- ── Part 3 ── -->
<g class="node-teal">
  <rect x="80" y="196" width="600" height="58" rx="8" stroke-width="0.8"/>
  <text class="label" x="380" y="220" text-anchor="middle" dominant-baseline="central">Part 3 — extended positive invariants (Noetherian)</text>
  <text class="sub"   x="380" y="240" text-anchor="middle" dominant-baseline="central">extendedRGplus is finitely generated as an ideal of R</text>
</g>

<line x1="380" y1="254" x2="380" y2="284" class="arrow"/>

<!-- ── Part 4 ── -->
<g class="node-teal">
  <rect x="80" y="284" width="600" height="58" rx="8" stroke-width="0.8"/>
  <text class="label" x="380" y="308" text-anchor="middle" dominant-baseline="central">Part 4 — generators inside a prescribed set</text>
  <text class="sub"   x="380" y="328" text-anchor="middle" dominant-baseline="central">Finite subset s ⊆ RGplusSet still spans extendedRGplus</text>
</g>

<!-- fork arrows -->
<line x1="220" y1="342" x2="220" y2="386" class="arrow"/>
<line x1="540" y1="342" x2="540" y2="386" class="arrow"/>

<!-- ── Part 5 (left) ── -->
<g class="node-coral">
  <rect x="80" y="386" width="270" height="72" rx="8" stroke-width="0.8"/>
  <text class="label" x="215" y="412" text-anchor="middle" dominant-baseline="central">Part 5 — Reynolds GIT spanning</text>
  <text class="sub"   x="215" y="432" text-anchor="middle" dominant-baseline="central">RGplusA finitely generated</text>
  <text class="sub"   x="215" y="448" text-anchor="middle" dominant-baseline="central">via Reynolds span property</text>
</g>

<!-- ── Part 5.5 (right) ── -->
<g class="node-coral">
  <rect x="410" y="386" width="270" height="72" rx="8" stroke-width="0.8"/>
  <text class="label" x="545" y="412" text-anchor="middle" dominant-baseline="central">Part 5.5 — Reynolds operator exists</text>
  <text class="sub"   x="545" y="432" text-anchor="middle" dominant-baseline="central">Linearly reductive G acting</text>
  <text class="sub"   x="545" y="448" text-anchor="middle" dominant-baseline="central">locally finitely on k-module</text>
</g>

<!-- merge arrows into Part 6 -->
<line x1="220" y1="458" x2="220" y2="502" class="arrow"/>
<line x1="545" y1="458" x2="545" y2="502" class="arrow"/>
<line x1="240" y1="522" x2="380" y2="522" stroke="#888" stroke-width="1.2" fill="none"/>
<line x1="525" y1="522" x2="380" y2="522" stroke="#888" stroke-width="1.2" fill="none"/>
<line x1="380" y1="522" x2="380" y2="546" class="arrow"/>

<!-- ── Part 6 (left box) ── -->
<g class="node-coral">
  <rect x="80" y="502" width="270" height="58" rx="8" stroke-width="0.8"/>
  <text class="label" x="215" y="526" text-anchor="middle" dominant-baseline="central">Part 6 — Reynolds rewrite</text>
  <text class="sub"   x="215" y="546" text-anchor="middle" dominant-baseline="central">f = Σ x̃ᵢ · ρ(cᵢ); RGplusA ⊆ span of lifts</text>
</g>

<!-- ── Reynolds identity note (right box) ── -->
<g class="node-gray">
  <rect x="410" y="502" width="270" height="58" rx="8" stroke-width="0.8"/>
  <text class="label" x="545" y="526" text-anchor="middle" dominant-baseline="central">Reynolds identity used</text>
  <text class="sub"   x="545" y="546" text-anchor="middle" dominant-baseline="central">ρ applied to both sides of Σ xᵢ·cᵢ</text>
</g>

<line x1="380" y1="546" x2="380" y2="596" class="arrow"/>

<!-- ── Part 7 ── -->
<g class="node-purple">
  <rect x="80" y="596" width="600" height="72" rx="8" stroke-width="1.2"/>
  <text class="label" x="380" y="620" text-anchor="middle" dominant-baseline="central">Part 7 — fixed subalgebra is finitely generated</text>
  <text class="sub"   x="380" y="642" text-anchor="middle" dominant-baseline="central">𝒜G(0) fin. gen. + irrelevant ideal fin. gen.</text>
  <text class="sub"   x="380" y="658" text-anchor="middle" dominant-baseline="central">→ A is finitely generated as a k-algebra  ∎</text>
</g>

<!-- ── Legend / notes ── -->
<text class="note" x="380" y="714" text-anchor="middle">Parts 1–2 supply the graded algebra structure</text>
<text class="note" x="380" y="732" text-anchor="middle">Parts 3–6 supply the finite generating set via Reynolds</text>
<text class="note" x="380" y="750" text-anchor="middle">Part 7 assembles everything into the main theorem</text>

<!-- ── Color legend ── -->
<rect x="80"  y="778" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="100" y="791" font-size="11" fill="#444" font-family="Georgia,serif">Graded algebra results</text>
<rect x="240" y="778" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="260" y="791" font-size="11" fill="#444" font-family="Georgia,serif">Ideal / finite type results</text>
<rect x="400" y="778" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="420" y="791" font-size="11" fill="#444" font-family="Georgia,serif">Reynolds / GIT spanning</text>
<rect x="560" y="778" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="580" y="791" font-size="11" fill="#444" font-family="Georgia,serif">Supporting step</text>

</svg>
</body>
</html>
